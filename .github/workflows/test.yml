name: test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install bash
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Test
        # Git Bash on Windows
        shell: bash
        run: bash --version && bash test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        # test.sh can't be checked: ShellCheck doesn't expand the try/catch aliases
        run: shellcheck --version && shellcheck --severity=warning try_catch.sh

  bash-versions:
    strategy:
      fail-fast: false
      matrix:
        bash: [ '4.4', '5.0', '5.1', '5.2', '5.3' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: docker run --rm -v "$PWD:/src" -w /src "bash:${{ matrix.bash }}" bash -c 'bash --version && bash test.sh'
